    <!--
      Brand intro (#wi), played on every page load and replayed on every in-app page
      change (src/components/IntroReplay.tsx calls window.wipelyIntro()).
      Plain HTML/CSS so it paints before the JS bundle. The CSS animation always ends
      with the overlay hidden, so it can never get stuck, even if JavaScript fails.
      It only holds while #root is still empty (dev server / client-only render), so
      it never fades out onto a blank page. Skipped entirely for reduced-motion users.
    -->
    <script>(function(d,c){var t;function p(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return c.add('wi-off');clearTimeout(t);var w=d.getElementById('wi');if(w){w.replaceWith(w.cloneNode(!0));c.remove('wi-on');void d.body.offsetWidth}c.add('wi-on')}addEventListener('animationend',function(e){if(e.animationName=='wi-out')t=setTimeout(function(){c.remove('wi-on')},200)});window.wipelyIntro=p;p()})(document,document.documentElement.classList)</script>
    <style>#wi{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#F6F4EF;pointer-events:none;animation:wi-out .25s ease-in .65s forwards}#wi svg{width:180px;animation:wi-in .25s ease-out}#wi .s{stroke-dasharray:1;stroke-dashoffset:1;animation:wi-draw .5s ease-in-out .15s forwards}@media(min-width:768px){#wi svg{width:240px}}#wi:has(~#root:empty){animation-play-state:paused}.wi-off #wi{display:none}@media(prefers-reduced-motion:reduce){#wi{display:none}}.wi-on header,.wi-on main>*>:first-child{animation:wi-up .4s ease-out .65s backwards}@keyframes wi-in{from{opacity:0;transform:translateY(8px)}}@keyframes wi-draw{to{stroke-dashoffset:0}}@keyframes wi-out{to{opacity:0;visibility:hidden}}@keyframes wi-up{from{opacity:.6;transform:translateY(12px)}}</style>
